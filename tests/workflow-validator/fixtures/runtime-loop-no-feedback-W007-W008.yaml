workflow: runtime_loop_thin
version: 1
description: |
  A runtime loop with no feedback and no escalation.
initial_state: working

states:
  - name: working
    description: |
      A cycle is running.
    is_final: false
  - name: done
    description: |
      Success terminal.
    is_final: true
  - name: escalated
    description: |
      The run stopped without success and was handed to its owner.
    is_final: true

events:
  - name: evidence_passed
    description: |
      The cycle evidence passed.
  - name: budget_gone
    description: |
      The cycle budget is exhausted.

transitions:
  - from: working
    to: done
    event: evidence_passed
  - from: working
    to: escalated
    event: budget_gone

runtime_loop:
  trigger:
    kind: schedule
    description: |
      A nightly schedule starts another cycle.
  goal: |
    The submitted artifact passes every declared check.
  evidence: |
    The project test suite.
  stop:
    on_success: done
    on_exhaustion: escalated
