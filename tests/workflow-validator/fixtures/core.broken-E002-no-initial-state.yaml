# E002: initial_state is missing.
workflow: core_minimal
version: 1
description: |
  A single piece of work is open and then closed.
# initial_state intentionally removed

states:
  - name: open
    description: |
      The work is open.
    is_final: false
  - name: closed
    description: |
      The work is closed.
    is_final: true

events:
  - name: finish
    description: |
      The work is finished.

guards:
  - name: is_ready
    description: |
      The work is ready to be closed.

transitions:
  - from: open
    to: closed
    event: finish
    guard: is_ready
