# W002: a reachable non-final state has no outgoing transition.
workflow: core_minimal
version: 1
description: |
  A single piece of work is open and then closed.
initial_state: open

states:
  - name: open
    description: |
      The work is open.
    is_final: false
  - name: parked
    description: |
      The work is parked and nothing leaves this state.
    is_final: false
  - name: closed
    description: |
      The work is closed.
    is_final: true

events:
  - name: park
    description: |
      The work is parked.
  - name: finish
    description: |
      The work is finished.

guards:
  - name: is_ready
    description: |
      The work is ready to be closed.

transitions:
  - from: open
    to: closed
    event: finish
    guard: is_ready
  - from: open
    to: parked
    event: park
