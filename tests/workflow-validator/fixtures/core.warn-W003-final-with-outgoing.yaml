# W003: a final state has an outgoing transition and does not declare re_entry_allowed.
workflow: core_minimal
version: 1
description: |
  A single piece of work is open and then closed.
initial_state: open

states:
  - name: open
    description: |
      The work is open.
    is_final: false
  - name: closed
    description: |
      The work is closed.
    is_final: true

events:
  - name: reopen
    description: |
      The work is reopened.
  - name: finish
    description: |
      The work is finished.

guards:
  - name: is_ready
    description: |
      The work is ready to be closed.

transitions:
  - from: open
    to: closed
    event: finish
    guard: is_ready
  - from: closed
    to: open
    event: reopen
