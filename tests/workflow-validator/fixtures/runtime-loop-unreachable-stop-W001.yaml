workflow: runtime_loop_unreachable_stop
version: 1
description: |
  stop.on_exhaustion names a declared state that no transition can reach.
initial_state: working

states:
  - name: working
    description: |
      A cycle is running.
    is_final: false
  - name: done
    description: |
      Success terminal.
    is_final: true
  - name: escalated
    description: |
      The run stopped without success and was handed to its owner.
    is_final: true

events:
  - name: evidence_passed
    description: |
      The cycle evidence passed.
  - name: budget_gone
    description: |
      The cycle budget is exhausted.

transitions:
  - from: working
    to: done
    event: evidence_passed

runtime_loop:
  trigger:
    kind: evidence_failure
    description: |
      A failed evidence check starts another cycle.
  goal: |
    The submitted artifact passes every declared check.
  evidence: |
    The project test suite plus schema validation of the produced artifact.
  feedback: |
    The failing check names and their messages, without the transcript.
  stop:
    on_success: done
    on_exhaustion: escalated
    escalation: |
      The owning team receives the run with the last failing evidence.
