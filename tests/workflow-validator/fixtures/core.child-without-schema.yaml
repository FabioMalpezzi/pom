# Child workflow with no context_schema, invoked by core.broken-E058-*.
workflow: core_child_without_schema
version: 1
description: |
  Checks one item and accepts it; declares no context_schema.
initial_state: checking

states:
  - name: checking
    description: |
      The item is being checked.
    is_final: false
  - name: accepted
    description: |
      The item passed the check.
    is_final: true

events:
  - name: check_done
    description: |
      The check finished.

transitions:
  - from: checking
    to: accepted
    event: check_done
