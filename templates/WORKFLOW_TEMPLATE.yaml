# Workflow Template
#
# This is the canonical template for a POM workflow model.
# In a target project, place workflow files under the configured
# workflows.root, usually workflows/<name>.yaml.
#
# A workflow file declares:
#   - identifying metadata
#   - states (named, with description, optional is_final)
#   - events (named, with description)
#   - guards (named, with description; predicates that condition a transition)
#   - transitions (from, to, event, optional guard)
#   - loop_guard on a state (optional; bounds a retry loop by visits and/or
#     duration, with a common exhaustion exit and named cause-specific exits)
#   - timeout on a state (optional; bounds residence in a non-loop state and
#     names the state entered when the duration elapses)
#   - invariants (textual; checked by humans and by the validator when possible)
#   - runtime_loop (optional; how the runtime re-enters the workflow and what
#     closes a cycle)
#
# Conventions:
#   - state, event, and guard names are snake_case;
#   - exactly one initial_state, listed also under states;
#   - descriptions are domain-level (what the state means, not how it is implemented);
#   - guards are referenced by name from transitions; their semantics live in the description and in target code;
#   - the file is the source of authority; Mermaid, validation report, scenarios, and code are derived.
#
# This template validates clean: `pom:workflow:lint` reports zero errors and
# zero warnings on it, and the child workflows it references ship beside it
# under templates/workflows/. That is deliberate. POM tells target projects
# that the model is the source of authority and that the validator is the
# judge; a canonical template failing its own validator would contradict the
# method it teaches. Constructs that cannot be wired into one coherent example
# are shown in commented blocks rather than left as broken references.

workflow: example_workflow      # snake_case unique name
version: 1                       # integer, bumped on incompatible model changes
description: |
  Short paragraph describing the business process this workflow models.
  Plain language; the reader should understand the domain after reading it.

  The example below is one coherent flow rather than a bag of syntax
  fragments: an item is drafted, submitted, validated by a child workflow
  (with a bounded revision loop when validation refuses it), checked by a
  fan-out batch, then signed off by a person within a deadline before it
  can be marked done.

initial_state: draft             # must appear in states[]

states:
  - name: draft
    description: |
      Domain-level description of what it means to be in this state.
    is_final: false

  - name: in_progress
    description: |
      The item is being worked on and is not yet ready for validation.
    is_final: false

  # Optional: invoke declares a synchronous child workflow that runs
  # while the parent is in this state. When the child reaches a
  # declared terminal state, the parent receives the corresponding
  # next_event and its normal transitions take over.
  #
  # Invariants:
  #   - child workflow file exists and validates as a POM workflow;
  #   - on_completion[].terminal_state is is_final: true in the child;
  #   - on_completion[].next_event is declared in the parent's events[];
  #   - mode: async / parallel is rejected (E029-equivalent for invoke).
  #
  # Use case: orchestrator parent that calls one child synchronously per
  # state entry (e.g., validating_payment -> payment_validation_flow).
  - name: validating
    description: |
      Parent is awaiting the child workflow to terminate.
    is_final: false
    invoke:
      workflow: workflows/validation-flow.yaml
      on_completion:
        - terminal_state: validated
          next_event: validation_passed
        - terminal_state: refused
          next_event: validation_failed

  # Optional: loop_guard bounds a loop as a whole. Declare it on the state
  # the loop re-enters (here every refused validation comes back to
  # revising, so revising counts the attempts). It needs at least one bound,
  # max_visits and/or max_duration, and a common exhaustion exit; the
  # cause-specific exits are optional and override on_exhaustion for one
  # bound only.
  #
  # Invariants:
  #   - max_visits is an integer >= 1;
  #   - max_duration uses <N>s, <N>min, <N>h, <N>d, or ISO 8601; a bare "m"
  #     is rejected as ambiguous (E063);
  #   - on_exhaustion, on_visits_exhausted, and on_duration_exhausted are
  #     declared states, and they count as reachable targets even without
  #     a transition (E064, E065);
  #   - a cause-specific exit for a bound that is not declared raises W060;
  #   - a state declares loop_guard or timeout, never both (E073).
  #
  # POM validates the shape. The target runtime owns the visit counter, the
  # clock, and the jump to the exhaustion state.
  - name: revising
    description: |
      Validation refused the item and it is being reworked before another
      attempt. Each refusal is one visit; the guard keeps "fix and resubmit"
      from becoming "resubmit forever".
    is_final: false
    loop_guard:
      max_visits: 3
      max_duration: 2d
      on_exhaustion: rejected                  # common exit; here it serves the duration bound
      on_visits_exhausted: revision_exhausted  # named exit for the visit bound

  # Optional Dynamic Workflow control-plane fields. Use only when
  # pom.config.json declares workflows.dynamic.enabled: true.
  #
  # fan_out_launch records a non-blocking launch boundary. The target
  # project's data plane owns workers, queues, schedulers, persistence,
  # cancellation mechanics, and real concurrent execution.
  #
  # Before declaring a fan_out_launch, three decisions must be visible
  # somewhere — in the state description, in the target project's docs, or
  # in metadata.open_points while they are still undecided:
  #   - where each worker does its work (shared or isolated workspace);
  #   - how worker results are merged;
  #   - what happens when two workers contradict each other on the same
  #     identity.
  # POM does not model workspaces and does not pick the isolation
  # mechanism. It refuses to leave the decision implicit, because parallel
  # workers sharing one mutable workspace overwrite each other.
  #
  # Handle lifecycle invariant: every launched handle must be awaited,
  # cancelled, or explicitly detached before any reachable final state.
  - name: launching_batch
    description: |
      Control-plane state that launches a target-owned external batch and continues.
    is_final: false
    fan_out_launch:
      workflow: workflows/child-workflow.yaml
      over: items
      handle: child_batch

  - name: awaiting_batch
    description: |
      Control-plane state that waits for the named batch handle.
    is_final: false
    await:
      handles: [child_batch]
      join: all                 # all | quorum | first
      # k: 2                    # required when join: quorum
      timeout: 30min
      on_timeout: timeout_elapsed   # an EVENT name, not a state
    # Optional lifecycle exits for active handles.
    # detach_handles: [child_batch]

  # The timeout branch cannot close the workflow directly: reaching a final
  # state while child_batch is still active raises E089, because it leaves
  # workers running and spending. Cancel first, then terminate.
  - name: cancelling_batch
    description: |
      Stops the workers still active before the workflow terminates.
    is_final: false
    cancel_handles: [child_batch]

  # Optional: timeout bounds residence in one non-loop state. Unlike the
  # await.timeout above, whose on_timeout names an EVENT, a state-level
  # timeout names the STATE entered when the duration elapses.
  #
  # Invariants:
  #   - duration uses the same grammar as loop_guard.max_duration (E071);
  #   - on_timeout is a declared state and counts as reachable (E072);
  #   - never combined with loop_guard on the same state (E073).
  #
  # The target runtime owns the timer. The sign_off_timeout event and its
  # transition below are how the runtime reports the expiry back into the
  # graph; keep them consistent with timeout.on_timeout.
  - name: awaiting_sign_off
    description: |
      A person confirms the batch outcome before the item is marked done.
      Residence here is bounded: a sign-off nobody gives is a decision
      nobody made, and the item must not wait for it forever.
    is_final: false
    timeout:
      duration: 48h
      on_timeout: rejected

  - name: done
    description: |
      Success terminal.
    is_final: true
    # Optional: re_entry_allowed declares a terminal state that admits
    # a documented exception out-transition (reopen, supersede, ...).
    # When true, the validator suppresses W003 on this state.
    # Default false. Has no effect on non-final states (open point).
    re_entry_allowed: false

  - name: rejected
    description: |
      Failure terminal. A model with no failure terminal usually hides one.
    is_final: true

  - name: revision_exhausted
    description: |
      Failure terminal for the revision budget: the item was refused
      max_visits times. Kept apart from rejected so reports can tell
      "refused once" from "refused until the budget ran out".
    is_final: true

events:
  - name: submit
    description: |
      What real-world action triggers this transition.
  - name: send_for_validation
    description: |
      The item is handed to the validation child workflow.
  - name: validation_passed
    description: |
      Parent-side event mapped from the child's `validated` terminal.
  - name: validation_failed
    description: |
      Parent-side event mapped from the child's `refused` terminal.
  - name: revision_ready
    description: |
      The reworked item is handed back to validation for another attempt.
  - name: batch_launched
    description: |
      The batch was launched and the control plane may continue.
  - name: batch_ready
    description: |
      Every launched worker reported a terminal status.
  - name: timeout_elapsed
    description: |
      Wake-up event emitted by the target runtime when the await budget
      is spent. POM declares it; the runtime emits it.
  - name: batch_cancelled
    description: |
      The still-active workers have been stopped.
  - name: sign_off_given
    description: |
      A person confirmed the batch outcome.
  - name: sign_off_timeout
    description: |
      Emitted by the target runtime when the sign-off timeout.duration
      elapses. POM declares it; the runtime emits it.

guards:
  - name: has_required_fields
    description: |
      Predicate condition for the transition to fire.
      The validator only checks that the name resolves; the actual predicate lives in target code.

  # Optional: evidence declares where the guard's pass/fail decision comes
  # from. design mode requires it for any guard that judges work produced by
  # an agent or by a model.
  #
  #   source: deterministic  - a test, schema check, query, diff, or build
  #                            result decides. Prefer this when available.
  #           model_judgment - a model decides.
  #           human          - a person decides.
  #
  #   independent_context is meaningful only for model_judgment. true means
  #   the judging context is separate from the context that produced the
  #   work. A verifier handed the executor's own context is not verifying, it
  #   is agreeing with itself, so the validator raises W005 when a
  #   model_judgment guard does not declare independence.
  #
  #   At a fan-in the stakes are highest: a guard leaving an await state
  #   decides what an entire parallel run produced. The validator raises W006
  #   when such a guard declares no evidence at all.
  - name: review_passed
    description: |
      The produced artifact was reviewed and accepted.
    evidence:
      source: model_judgment
      independent_context: true
      description: |
        A reviewer that receives the artifact and the acceptance rules, and
        never the executor's conversation.

transitions:
  - from: draft
    to: in_progress
    event: submit
    guard: has_required_fields   # optional
    description: |
      Optional prose explaining why this transition exists and any nuance not obvious from from/to/event.

  - from: in_progress
    to: validating
    event: send_for_validation

  - from: validating
    to: launching_batch
    event: validation_passed

  # A refusal does not end the item: it enters the bounded revision loop.
  # Once the loop_guard on revising is exhausted, the runtime jumps to the
  # declared exhaustion state; no transition is needed for that jump.
  - from: validating
    to: revising
    event: validation_failed

  - from: revising
    to: validating
    event: revision_ready

  - from: launching_batch
    to: awaiting_batch
    event: batch_launched

  - from: awaiting_batch
    to: awaiting_sign_off
    event: batch_ready
    guard: review_passed

  - from: awaiting_batch
    to: cancelling_batch
    event: timeout_elapsed

  - from: cancelling_batch
    to: rejected
    event: batch_cancelled

  - from: awaiting_sign_off
    to: done
    event: sign_off_given

  # Mirrors timeout.on_timeout on awaiting_sign_off: the runtime emits
  # sign_off_timeout when the duration elapses, and the graph lands where
  # the primitive says it lands.
  - from: awaiting_sign_off
    to: rejected
    event: sign_off_timeout

  # Optional: transition-level invoke declares a synchronous child
  # workflow triggered when the event fires from the source state.
  # While the child runs, the parent is blocked in "from". When the
  # child reaches one of its terminal states, the parent jumps to the
  # target declared in on_completion (one target per child terminal).
  #
  # Invariants:
  #   - the transition has invoke OR a "to" field, never both;
  #   - child workflow exists and validates as a POM workflow;
  #   - on_completion[].terminal_state is is_final: true in the child;
  #   - on_completion[].target is a declared state in this parent;
  #   - mode: async / parallel is rejected.
  #
  # Use case: precondition that requires its own sub-workflow before
  # the parent can decide which state to enter (e.g., submit_for_review
  # -> validation_flow -> accepted | rejected).
  #
  # Shown commented out because this example already reaches the child
  # through the state-level invoke on `validating`. Wiring both styles into
  # one flow would teach the syntax at the cost of a model nobody would
  # actually write. Uncomment it in a model that needs the transition form,
  # and declare `submit_for_review` and `accepted` there.
  #
  # - from: draft
  #   event: submit_for_review
  #   invoke:
  #     workflow: workflows/validation-flow.yaml
  #     on_completion:
  #       - terminal_state: validated
  #         target: accepted
  #       - terminal_state: refused
  #         target: rejected

invariants:
  - description: |
      Plain-text rule that must hold across the workflow.
      Example: "A done item cannot return to draft."
  - description: |
      Example: "Every validated item must eventually reach done or rejected."
  - description: |
      No final state is reached while child_batch is still active.
  - description: |
      No loop runs unbounded: a state that a retry re-enters declares a
      loop_guard, and a state that waits for a person declares a timeout.

# Optional runtime loop contract.
#
# The state graph says which transitions are legal. It does not say what
# starts another cycle, what evidence decides success, what a failed cycle
# hands to the next one, or who receives the run when the budget is gone.
# Those are the parts a loop needs to be a managed process instead of
# "keep trying", and they belong here.
#
# The block is optional; declare it when the workflow is re-entered by a
# runtime rather than driven start-to-finish by a caller. Once declared it
# must be complete: trigger, goal, evidence, and stop are validated
# (E100-E106), and missing feedback or escalation raise W007 and W008.
#
# This is the runtime loop, not the experiment loop. An experiment that
# measures this workflow keeps its own budget, gates, signals, and exits in
# its criteria contract (prompts/28-loop-goal-define-criteria.md); do not
# collapse the two.
runtime_loop:
  trigger:
    # user_request | schedule | event | evidence_failure
    kind: evidence_failure
    description: |
      What actually starts another cycle. "The agent decides to continue" is
      not a trigger.
  goal: |
    The observable state a cycle is trying to reach. Not "keep improving".
  evidence: |
    The test, schema check, query, diff, or review that decides whether the
    cycle succeeded. "The agent says it is done" is not evidence.
  feedback: |
    What the next cycle receives when the evidence fails: a compact,
    actionable description of what was wrong. Not the whole transcript, and
    not a bare retry.
  stop:
    on_success: done
    on_exhaustion: rejected
    escalation: |
      Who receives the run when it stops without success. A loop with no
      named owner at exhaustion is a cost leak.

# Optional metadata block for documentation and indexing.
metadata:
  owner: team or role

  # provenance declares where this model came from:
  #   observed    - drawn from runs, traces, logs, an existing implementation,
  #                 or a manual procedure people already follow;
  #   speculative - designed from intention alone, not yet confirmed by a run.
  # Both are legitimate. Declaring it stops an untested design from being read
  # later as a description of how the process actually behaves.
  provenance: observed

  # open_points holds decisions the model deliberately did not make.
  # design mode writes gaps here instead of inventing business rules.
  open_points:
    - "Who may reopen a done item, and under which authority."
    - "Worker workspace, merge policy, and worker disagreement for the batch: undecided in this example, and required before a real fan_out_launch."

  tags:
    - example
    - draft
